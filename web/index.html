<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- General App Meta -->
  <title>Expense Splitter</title>
  <meta name="description" content="Split group expenses, manage unit balances, and generate intelligent budget settlements.">
  <meta name="theme-color" content="#000000">

  <!-- iOS Meta & Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Expense Splitter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon and Manifest -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph / Social Sharing Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Expense Splitter">
  <meta property="og:description" content="Seamlessly calculate group debts and settlements.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter Meta -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Expense Splitter">
  <meta name="twitter:description" content="Seamlessly calculate group debts and settlements.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- Flutter Web Bootstrap -->
  <script src="flutter.js" defer></script>
</head>
<body style="background-color: #000000;">
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: "{{flutter_service_worker_version}}",
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
