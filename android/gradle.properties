android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Disable daemon and incremental compilation to prevent file-locking crashes
org.gradle.daemon=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# Cap JVM heap memory to 3GB to prevent OOM crashes
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Point Gradle directly to Android Studio's bundled Java JDK (using forward slashes)
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr